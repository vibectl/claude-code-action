# Orchestrates CI workflows for vibectl fork
# Runs on vibectl-main pushes, PRs targeting vibectl-main, and manual dispatch
# Integration test workflows (test-base-action, test-mcp-servers, etc.) are disabled
# in the fork — they require ANTHROPIC_API_KEY and execute against Anthropic's API.
# Fork CI validates: unit tests, formatting, and type checking.
name: CI All

on:
  push:
    branches:
      - vibectl-main
  pull_request:
    branches:
      - vibectl-main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
