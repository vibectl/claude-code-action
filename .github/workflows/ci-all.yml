# Orchestrates CI workflows for vibectl fork
# Runs on vibectl-main pushes, PRs targeting vibectl-main, and manual dispatch
# Integration test workflows (test-base-action, test-mcp-servers, etc.) are disabled
# in the fork — they require ANTHROPIC_API_KEY and execute against Anthropic's API.
# Fork CI validates: unit tests, formatting, type checking, and container build.
name: CI All

on:
  push:
    branches:
      - vibectl-main
  pull_request:
    branches:
      - vibectl-main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  container-build:
    name: Container Build & Test
    # Self-hosted runner has Docker CE + buildx (ubuntu-latest does not guarantee Docker)
    runs-on: [self-hosted, Linux, X64, vibectl]
    steps:
      - uses: actions/checkout@v6

      - name: Build container test image
        run: |
          docker build \
            -f ci/Dockerfile.smoke-test \
            -t cca-container-test:ci \
            .

      - name: Run smoke test
        run: docker run --rm cca-container-test:ci

      - name: Run integration test
        run: |
          docker run --rm cca-container-test:ci \
            bun run /opt/cca/ci/integration-test.ts

      - name: Cleanup image
        if: always()
        run: |
          echo "Cleaning up container test image..."
          docker rmi cca-container-test:ci || echo "Warning: image cleanup failed (may already be removed)"
