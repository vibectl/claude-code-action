name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.target_commitish }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.12

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-deps-${{ hashFiles('bun.lock') }}
          restore-keys: bun-deps-

      - name: Install dependencies
        run: bun install

      - name: Run TypeScript type check
        run: bun run typecheck

      - name: Run tests
        run: bun test

      - name: Build action bundle
        run: bun run build:action

      - name: Verify dist is up to date
        run: |
          if ! git diff --quiet dist/; then
            echo "::error::dist/index.js is out of date. Run 'bun run build:action' and commit the result."
            git diff --stat dist/
            exit 1
          fi

      - name: Extract major version
        id: version
        run: |
          TAG="${{ github.event.release.tag_name }}"
          MAJOR=$(echo "$TAG" | grep -oP '^v\d+' || echo "")
          if [ -z "$MAJOR" ]; then
            echo "::error::Could not extract major version from tag '$TAG'"
            exit 1
          fi
          echo "major=$MAJOR" >> "$GITHUB_OUTPUT"
          echo "Major version tag: $MAJOR"

      - name: Update major version tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -fa "${{ steps.version.outputs.major }}" -m "Update ${{ steps.version.outputs.major }} to ${{ github.event.release.tag_name }}"
          git push origin "${{ steps.version.outputs.major }}" --force
