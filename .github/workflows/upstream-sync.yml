# Upstream sync automation for vibectl CCA fork
#
# Two modes of operation:
#   1. Daily cron (schedule): Updates upstream-tracking branch to match upstream/main.
#   2. Manual dispatch (workflow_dispatch): Creates a sync PR merging
#      upstream-tracking into vibectl-main.
#
# Design decisions:
#   - Daily silent tracking + on-demand PR creation
#   - Upstream .github/workflows/ files are not carried (reviewed per-file on sync)
#   - No auto-merge: all sync PRs require human review
#   - Self-hosted runner: consistent with all vibectl CI
name: Upstream Sync

on:
  schedule:
    # Daily at 06:00 UTC
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Sync mode: track (update tracking branch) or create-pr (create sync PR)"
        required: true
        default: "track"
        type: choice
        options:
          - track
          - create-pr

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: [self-hosted, Linux, X64, vibectl]
    steps:
      - name: Checkout fork
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: vibectl-main

      - name: Ensure gh CLI is available
        run: |
          if command -v gh &>/dev/null; then
            echo "gh CLI already installed: $(gh --version | head -1)"
          else
            echo "Installing latest gh CLI..."
            GH_VERSION=$(curl -fsSL https://api.github.com/repos/cli/cli/releases/latest | grep -oP '"tag_name":\s*"v\K[^"]+')
            if [ -z "$GH_VERSION" ]; then
              echo "::error::Failed to detect gh CLI version from GitHub API."
              exit 1
            fi
            curl -fsSL -L "https://github.com/cli/cli/releases/download/v${GH_VERSION}/gh_${GH_VERSION}_linux_amd64.tar.gz" \
              -o /tmp/gh.tar.gz
            tar -xzf /tmp/gh.tar.gz -C /tmp
            mkdir -p "$HOME/.local/bin"
            cp "/tmp/gh_${GH_VERSION}_linux_amd64/bin/gh" "$HOME/.local/bin/gh"
            echo "$HOME/.local/bin" >> "$GITHUB_PATH"
            rm -rf /tmp/gh.tar.gz "/tmp/gh_${GH_VERSION}_linux_amd64"
            echo "Installed: $($HOME/.local/bin/gh --version | head -1)"
          fi

      - name: Configure git
        run: |
          git config user.name "vibectl-bot"
          git config user.email "bot@vibectl.dev"

      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/anthropics/claude-code-action.git 2>/dev/null || true
          git fetch upstream main --quiet

      - name: Determine mode
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "mode=track" >> "$GITHUB_OUTPUT"
          else
            echo "mode=${{ inputs.mode }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Update upstream-tracking branch
        id: tracking
        run: |
          TRACKING_SHA=$(git rev-parse upstream-tracking 2>/dev/null || echo "none")
          UPSTREAM_SHA=$(git rev-parse upstream/main)

          if [ "$TRACKING_SHA" = "$UPSTREAM_SHA" ]; then
            echo "upstream-tracking is already up to date with upstream/main"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "upstream_sha=$UPSTREAM_SHA" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Updating upstream-tracking: $TRACKING_SHA -> $UPSTREAM_SHA"
          git checkout upstream-tracking
          if ! git merge --ff-only upstream/main; then
            echo "::error::Fast-forward merge failed. Manual intervention required."
            exit 1
          fi
          git push origin upstream-tracking
          git checkout vibectl-main

          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "upstream_sha=$UPSTREAM_SHA" >> "$GITHUB_OUTPUT"

      - name: Create sync PR
        if: steps.mode.outputs.mode == 'create-pr'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          UPSTREAM_SHA="${{ steps.tracking.outputs.upstream_sha }}"
          SHORT_SHA="${UPSTREAM_SHA:0:7}"

          # Check for pending changes
          PENDING=$(git log vibectl-main..upstream-tracking --oneline 2>/dev/null || echo "")
          if [ -z "$PENDING" ]; then
            echo "No upstream changes to sync"
            exit 0
          fi

          COMMIT_COUNT=$(echo "$PENDING" | wc -l | tr -d ' ')
          BRANCH_DATE=$(date +%Y-%m-%d)
          SYNC_BRANCH="sync/upstream-${BRANCH_DATE}"

          # Clean up existing sync branch if present
          if git ls-remote --exit-code origin "refs/heads/${SYNC_BRANCH}" >/dev/null 2>&1; then
            git push origin --delete "${SYNC_BRANCH}" 2>/dev/null || true
          fi

          # Create sync branch and merge
          git checkout -b "$SYNC_BRANCH" vibectl-main

          HAS_CONFLICTS="false"
          if ! git merge upstream-tracking --no-edit \
            -m "Merge upstream CCA (${SHORT_SHA}) into vibectl-main"; then
            git add -A
            git commit --no-edit \
              -m "Merge upstream CCA (${SHORT_SHA}) — CONFLICTS NEED RESOLUTION" || true
            HAS_CONFLICTS="true"
          fi

          git push origin "$SYNC_BRANCH"

          # Collect info for PR body
          COMMITS=$(git log vibectl-main..upstream-tracking --oneline --no-decorate | head -20)
          CHANGED_FILES=$(git diff vibectl-main..upstream-tracking --name-only | sort)

          # Build PR body
          PR_BODY=$(cat <<BODY
          ## Upstream Sync: ${COMMIT_COUNT} commits (${SHORT_SHA})

          Syncs upstream CCA changes from \`upstream/main\` into \`vibectl-main\`.

          **Upstream ref**: \`${UPSTREAM_SHA}\`
          **Commits pending**: ${COMMIT_COUNT}
          $([ "$HAS_CONFLICTS" = "true" ] && echo -e "\n**WARNING**: Merge conflicts present. Resolve before merging.")

          ### Upstream Commits
          \`\`\`
          ${COMMITS}
          \`\`\`

          ### Changed Files
          \`\`\`
          ${CHANGED_FILES}
          \`\`\`

          ---
          *Generated by upstream-sync workflow. All sync merges require human review.*
          BODY
          )

          gh pr create \
            -R "${{ github.repository }}" \
            --base vibectl-main \
            --head "$SYNC_BRANCH" \
            --title "Upstream sync: CCA ${SHORT_SHA} (${COMMIT_COUNT} commits)" \
            --body "$PR_BODY"

      - name: Summary
        run: |
          MODE="${{ steps.mode.outputs.mode }}"
          {
            echo "## Upstream Sync Summary"
            echo ""
            echo "**Mode**: ${MODE}"
            echo "**Upstream SHA**: ${{ steps.tracking.outputs.upstream_sha }}"
            echo "**Tracking updated**: ${{ steps.tracking.outputs.changed }}"
          } >> "$GITHUB_STEP_SUMMARY"
