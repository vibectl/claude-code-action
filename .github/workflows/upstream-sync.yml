# Upstream sync automation for vibectl CCA fork
#
# Two modes of operation:
#   1. Daily cron (schedule): Silently updates upstream-tracking branch to match
#      upstream/main. No PR creation, no noise.
#   2. Manual dispatch (workflow_dispatch): Creates a sync PR merging
#      upstream-tracking into vibectl-main with per-directory conflict risk
#      classification and upstream workflow file detection.
#
# Design decisions:
#   - Option B sync model: daily silent tracking + on-demand PR creation
#   - Option D workflow policy: upstream .github/workflows/ files flagged, not carried
#   - No auto-merge: all sync PRs require human review
#   - Self-hosted runner: consistent with all vibectl CI
#
# Manual trigger:
#   gh workflow run upstream-sync.yml -f mode=create-pr
#   gh workflow run upstream-sync.yml -f mode=track
name: Upstream Sync

on:
  schedule:
    # Daily at 06:00 UTC — after typical upstream US-timezone release window
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Sync mode: track (update tracking branch) or create-pr (create sync PR)"
        required: true
        default: "track"
        type: choice
        options:
          - track
          - create-pr

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  sync:
    runs-on: [self-hosted, Linux, X64, vibectl]
    steps:
      - name: Checkout fork
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: vibectl-main

      - name: Ensure gh CLI is available
        run: |
          if command -v gh &>/dev/null; then
            echo "gh CLI already installed: $(gh --version | head -1)"
          else
            echo "Installing latest gh CLI (no sudo)..."
            GH_VERSION=$(curl -fsSL https://api.github.com/repos/cli/cli/releases/latest | grep -oP '"tag_name":\s*"v\K[^"]+')
            if [ -z "$GH_VERSION" ]; then
              echo "::error::Failed to extract gh CLI version from GitHub API response."
              echo "The GitHub releases API may have changed format or be temporarily unavailable."
              echo "Manual fix: install gh CLI on the runner, or set GH_VERSION manually."
              exit 1
            fi
            echo "Latest version: $GH_VERSION"
            curl -fsSL -L "https://github.com/cli/cli/releases/download/v${GH_VERSION}/gh_${GH_VERSION}_linux_amd64.tar.gz" \
              -o /tmp/gh.tar.gz
            tar -xzf /tmp/gh.tar.gz -C /tmp
            mkdir -p "$HOME/.local/bin"
            cp "/tmp/gh_${GH_VERSION}_linux_amd64/bin/gh" "$HOME/.local/bin/gh"
            echo "$HOME/.local/bin" >> "$GITHUB_PATH"
            rm -rf /tmp/gh.tar.gz "/tmp/gh_${GH_VERSION}_linux_amd64"
            echo "Installed: $($HOME/.local/bin/gh --version | head -1)"
          fi

      - name: Configure git
        run: |
          git config user.name "vibectl-bot"
          git config user.email "bot@vibectl.dev"

      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/anthropics/claude-code-action.git 2>/dev/null || true
          git fetch upstream main --quiet

      - name: Determine mode
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "mode=track" >> "$GITHUB_OUTPUT"
          else
            echo "mode=${{ inputs.mode }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Update upstream-tracking branch
        id: tracking
        run: |
          TRACKING_SHA=$(git rev-parse upstream-tracking 2>/dev/null || echo "none")
          UPSTREAM_SHA=$(git rev-parse upstream/main)

          if [ "$TRACKING_SHA" = "$UPSTREAM_SHA" ]; then
            echo "upstream-tracking is already up to date with upstream/main"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "upstream_sha=$UPSTREAM_SHA" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Updating upstream-tracking: $TRACKING_SHA -> $UPSTREAM_SHA"
          git checkout upstream-tracking
          git merge --ff-only upstream/main
          git push origin upstream-tracking
          git checkout vibectl-main

          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "upstream_sha=$UPSTREAM_SHA" >> "$GITHUB_OUTPUT"

      - name: Analyze upstream changes
        if: steps.mode.outputs.mode == 'create-pr'
        id: analyze
        run: |
          UPSTREAM_SHA="${{ steps.tracking.outputs.upstream_sha }}"
          SHORT_SHA="${UPSTREAM_SHA:0:7}"

          # Check for pending upstream changes
          PENDING=$(git log vibectl-main..upstream-tracking --oneline 2>/dev/null || echo "")

          if [ -z "$PENDING" ]; then
            echo "No upstream changes to sync"
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "has_changes=true" >> "$GITHUB_OUTPUT"
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"

          COMMIT_COUNT=$(echo "$PENDING" | wc -l | tr -d ' ')
          echo "commit_count=$COMMIT_COUNT" >> "$GITHUB_OUTPUT"

          # Save commit list and changed files to temp files
          git log vibectl-main..upstream-tracking --oneline --no-decorate | head -20 > /tmp/sync_commits.txt
          git diff vibectl-main..upstream-tracking --name-only | sort > /tmp/sync_changed_files.txt

          # Detect upstream workflow changes
          WORKFLOW_FILES=$(grep "^\.github/workflows/" /tmp/sync_changed_files.txt || echo "")
          if [ -n "$WORKFLOW_FILES" ]; then
            echo "has_workflow_changes=true" >> "$GITHUB_OUTPUT"
            echo "$WORKFLOW_FILES" > /tmp/sync_workflow_files.txt
          else
            echo "has_workflow_changes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Classify conflict risk
        if: steps.mode.outputs.mode == 'create-pr' && steps.analyze.outputs.has_changes == 'true'
        run: |
          # Risk classification script implementing EP150 Section 10.5 risk matrix
          cat > /tmp/classify_risk.sh << 'SCRIPT'
          #!/bin/bash
          set -euo pipefail

          # Explicit file-level risk (vibectl-patched or replaced files)
          declare -A FILE_RISK=(
            ["src/github/context.ts"]="HIGH"
            ["src/github/constants.ts"]="LOW"
            ["src/github/token.ts"]="NONE"
            ["src/entrypoints/collect-inputs.ts"]="LOW"
            ["src/entrypoints/run.ts"]="NONE"
            ["src/mcp/install-mcp-server.ts"]="NONE"
            ["src/github/operations/git-config.ts"]="NONE"
          )

          # Directory-level defaults (longest prefix match used)
          declare -A DIR_RISK=(
            ["src/github/api/"]="NONE"
            ["src/github/data/"]="NONE"
            ["src/github/validation/"]="NONE"
            ["src/github/utils/"]="NONE"
            ["src/github/operations/"]="NONE"
            ["src/github/"]="LOW"
            ["src/entrypoints/"]="LOW"
            ["src/mcp/"]="NONE"
            ["src/modes/"]="NONE"
            ["src/create-prompt/"]="NONE"
            ["src/utils/"]="NONE"
            ["src/vibectl/"]="NONE"
            ["base-action/"]="NONE"
            ["test/"]="NONE"
            [".github/"]="NONE"
          )

          HIGH=()
          LOW=()
          NONE=()
          UNKNOWN=()

          while IFS= read -r file; do
            [[ -z "$file" || "$file" =~ ^[[:space:]]*$ ]] && continue

            risk="${FILE_RISK[$file]:-}"

            if [ -z "$risk" ]; then
              best=""
              best_len=0
              for dir in "${!DIR_RISK[@]}"; do
                if [[ "$file" == "$dir"* ]] && [ ${#dir} -gt $best_len ]; then
                  best="$dir"
                  best_len=${#dir}
                fi
              done
              if [ -z "$best" ]; then
                risk="UNKNOWN"
              else
                risk="${DIR_RISK[$best]:-UNKNOWN}"
              fi
            fi

            case "$risk" in
              HIGH)    HIGH+=("$file") ;;
              LOW)     LOW+=("$file") ;;
              NONE)    NONE+=("$file") ;;
              *)       UNKNOWN+=("$file") ;;
            esac
          done < /tmp/sync_changed_files.txt

          # Write risk report as markdown
          exec > /tmp/risk_report.md

          if [ ${#HIGH[@]} -gt 0 ]; then
            echo '### :red_circle: HIGH Risk (vibectl patches may conflict)'
            echo ''
            echo 'These files have vibectl patches and high upstream churn. Manual review required.'
            echo ''
            for f in "${HIGH[@]}"; do echo "- \`$f\`"; done
            echo ''
          fi

          if [ ${#LOW[@]} -gt 0 ]; then
            echo '### :yellow_circle: LOW Risk (small patches, likely clean merge)'
            echo ''
            for f in "${LOW[@]}"; do echo "- \`$f\`"; done
            echo ''
          fi

          if [ ${#NONE[@]} -gt 0 ]; then
            echo '### :green_circle: NO Risk (no vibectl modifications)'
            echo ''
            echo "${#NONE[@]} files with no vibectl modifications (clean merge expected)."
            echo ''
            echo '<details>'
            echo '<summary>Show files</summary>'
            echo ''
            for f in "${NONE[@]}"; do echo "- \`$f\`"; done
            echo ''
            echo '</details>'
            echo ''
          fi

          if [ ${#UNKNOWN[@]} -gt 0 ]; then
            echo '### :white_circle: UNKNOWN Risk (not in risk matrix)'
            echo ''
            echo 'New files or directories not yet classified. Review manually.'
            echo ''
            for f in "${UNKNOWN[@]}"; do echo "- \`$f\`"; done
            echo ''
          fi
          SCRIPT

          chmod +x /tmp/classify_risk.sh
          bash /tmp/classify_risk.sh

      - name: Create sync PR
        if: steps.mode.outputs.mode == 'create-pr' && steps.analyze.outputs.has_changes == 'true'
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BRANCH_DATE=$(date +%Y-%m-%d)
          SYNC_BRANCH="sync/upstream-${BRANCH_DATE}"
          SHORT_SHA="${{ steps.analyze.outputs.short_sha }}"
          COMMIT_COUNT="${{ steps.analyze.outputs.commit_count }}"

          # Clean up existing sync branch if present
          if git ls-remote --exit-code origin "refs/heads/${SYNC_BRANCH}" >/dev/null 2>&1; then
            echo "Sync branch ${SYNC_BRANCH} already exists — recreating"
            git push origin --delete "${SYNC_BRANCH}" 2>/dev/null || true
          fi

          # Create sync branch from vibectl-main and merge upstream-tracking
          git checkout -b "$SYNC_BRANCH" vibectl-main

          HAS_CONFLICTS="false"
          if ! git merge upstream-tracking --no-edit \
            -m "Merge upstream CCA (${SHORT_SHA}) into vibectl-main"; then
            echo "Merge has conflicts — committing conflict markers for human resolution"
            git add -A
            git commit --no-edit \
              -m "Merge upstream CCA (${SHORT_SHA}) — CONFLICTS NEED RESOLUTION" || true
            HAS_CONFLICTS="true"
          fi

          git push origin "$SYNC_BRANCH"
          echo "sync_branch=$SYNC_BRANCH" >> "$GITHUB_OUTPUT"
          echo "has_conflicts=$HAS_CONFLICTS" >> "$GITHUB_OUTPUT"

          # Assemble PR body from temp files
          {
            echo "## Upstream Sync: ${COMMIT_COUNT} commits (${SHORT_SHA})"
            echo ""
            echo "Syncs upstream CCA changes from \`upstream/main\` into \`vibectl-main\`."
            echo ""
            echo "**Upstream ref**: \`${{ steps.tracking.outputs.upstream_sha }}\`"
            echo "**Commits pending**: ${COMMIT_COUNT}"

            # Conflict warning
            if [ "$HAS_CONFLICTS" = "true" ]; then
              echo ""
              echo "## :rotating_light: Merge Conflicts"
              echo ""
              echo "This sync PR contains **unresolved merge conflicts**. Conflict markers are committed to enable review."
              echo ""
              echo "**To resolve:**"
              echo "1. Check out the sync branch: \`git checkout ${SYNC_BRANCH}\`"
              echo "2. Resolve conflicts in the marked files"
              echo "3. Commit the resolution and push"
              echo "4. Re-run CI to validate"
            fi

            # Workflow changes warning (Option D)
            if [ "${{ steps.analyze.outputs.has_workflow_changes }}" = "true" ]; then
              echo ""
              echo "## :warning: Upstream Workflow Changes Detected (Option D Policy)"
              echo ""
              echo "Upstream CCA includes new or modified workflow files. Per vibectl's **Option D workflow policy**, upstream workflows are **not carried into vibectl-main**. Review these files and decide:"
              echo "- **Ignore**: upstream workflow not relevant to vibectl"
              echo "- **Adapt**: create a vibectl-equivalent workflow inspired by upstream intent"
              echo "- **Adopt**: carry the upstream workflow (exception to Option D — document rationale)"
              echo ""
              echo "**Files:**"
              echo '```'
              cat /tmp/sync_workflow_files.txt
              echo '```'
            fi

            echo ""
            echo "## Upstream Commits"
            echo ""
            echo '```'
            cat /tmp/sync_commits.txt
            echo '```'

            echo ""
            echo "## Conflict Risk Classification"
            echo ""
            echo "Risk levels per [FORK_CHANGES.md](./FORK_CHANGES.md) merge conflict risk assessment."
            echo ""
            cat /tmp/risk_report.md

            echo "## vibectl Patched Files"
            echo ""
            echo "CCA source files modified by vibectl that need merge attention if upstream changes overlap:"
            echo ""
            echo "| File | Patch Summary |"
            echo "|------|---------------|"
            echo "| \`src/github/constants.ts\` | Bot identity env var fallback (+10/-4) |"
            echo "| \`src/github/context.ts\` | VIBECTL_CONTEXT_JSON fallback with try-catch and validation (+47/-2) |"
            echo "| \`src/entrypoints/collect-inputs.ts\` | VIBECTL_TASK_CONFIG file fallback (+14/-1) |"
            echo ""
            echo "See [FORK_CHANGES.md](./FORK_CHANGES.md) for re-application instructions."
            echo ""

            echo "## Review Checklist"
            echo ""
            echo "- [ ] Review HIGH risk files for patch conflicts"
            echo "- [ ] Verify CCA test suite passes (CI triggered on this PR)"
            echo "- [ ] Check for new dependencies or env var assumptions"
            echo "- [ ] Verify vibectl integration layer tests still pass"
            echo "- [ ] If upstream workflows changed: apply Option D policy (see warning above if present)"
            echo ""
            echo "---"
            echo "*Generated by upstream-sync workflow. All sync merges require human review.*"
          } > /tmp/pr_body.md

          # Create PR on fork repo (gh defaults to parent for forks)
          PR_TITLE="Upstream sync: CCA ${SHORT_SHA} (${COMMIT_COUNT} commits)"
          PR_URL=""
          FIRST_ATTEMPT_OUTPUT=""

          # First attempt: with --label flag (may fail if label doesn't exist)
          FIRST_ATTEMPT_OUTPUT=$(gh pr create \
            -R "${{ github.repository }}" \
            --base vibectl-main \
            --head "$SYNC_BRANCH" \
            --title "$PR_TITLE" \
            --body-file /tmp/pr_body.md \
            --label "upstream-sync" 2>&1) && PR_URL="$FIRST_ATTEMPT_OUTPUT" || true

          if [ -z "$PR_URL" ]; then
            echo "::warning::First PR creation attempt failed. Error output:"
            echo "$FIRST_ATTEMPT_OUTPUT"
            echo ""
            echo "Retrying without --label flag..."

            # Retry without --label (most common failure cause)
            PR_URL=$(gh pr create \
              -R "${{ github.repository }}" \
              --base vibectl-main \
              --head "$SYNC_BRANCH" \
              --title "$PR_TITLE" \
              --body-file /tmp/pr_body.md 2>&1) || {
              echo "::error::PR creation failed on both attempts."
              echo "First attempt error: $FIRST_ATTEMPT_OUTPUT"
              echo "Second attempt error: $PR_URL"
              exit 1
            }
          fi

          echo "pr_url=$PR_URL" >> "$GITHUB_OUTPUT"
          echo "Created sync PR: $PR_URL"

      - name: Trigger CI on sync branch
        if: steps.mode.outputs.mode == 'create-pr' && steps.analyze.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SYNC_BRANCH="${{ steps.pr.outputs.sync_branch }}"
          echo "Dispatching ci-all.yml on branch: $SYNC_BRANCH"
          gh workflow run ci-all.yml --ref "$SYNC_BRANCH" -R "${{ github.repository }}"
          echo "CI dispatched successfully"

      - name: Summary
        run: |
          MODE="${{ steps.mode.outputs.mode }}"
          {
            echo "## Upstream Sync Summary"
            echo ""
            echo "**Mode**: ${MODE}"
            echo "**Upstream SHA**: ${{ steps.tracking.outputs.upstream_sha }}"
            echo "**Tracking updated**: ${{ steps.tracking.outputs.changed }}"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$MODE" = "create-pr" ]; then
            if [ "${{ steps.analyze.outputs.has_changes }}" = "true" ]; then
              {
                echo "**PR**: ${{ steps.pr.outputs.pr_url }}"
                echo "**Conflicts**: ${{ steps.pr.outputs.has_conflicts }}"
                echo "**Workflow changes**: ${{ steps.analyze.outputs.has_workflow_changes }}"
              } >> "$GITHUB_STEP_SUMMARY"
            else
              echo "**Result**: No upstream changes to sync" >> "$GITHUB_STEP_SUMMARY"
            fi
          fi
